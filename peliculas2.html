<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Películas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: #151821;
            --card-color: #1b1f2b;
            --primary: #e50914;
            --primary-hover: #ff2a36;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #272a38;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(180deg, #151821 0%, #0e1017 100%);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;
            cursor: pointer;
        }

        .logo-icon {
            background: var(--primary);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .controls-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            max-width: 700px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 220px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: #1e2230;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.2);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .year-select-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e2230;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .year-select-box label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .year-select-box select {
            background: transparent;
            color: #fff;
            border: none;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .year-select-box select option {
            background: #1e2230;
            color: #fff;
        }

        .btn-random {
            background: #272c3d;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 9px 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-random:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        main {
            max-width: 1400px;
            margin: 25px auto;
            padding: 0 24px;
            flex: 1;
            width: 100%;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--primary);
        }

        .badge-count {
            background: #1e2230;
            color: var(--text-muted);
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        /* Grid de Películas */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
        }

        @media (max-width: 650px) {
            .movies-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
            .header-inner {
                padding: 12px 16px;
            }
            .controls-wrapper {
                max-width: 100%;
            }
        }

        .movie-card {
            background: var(--surface-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.06);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.6);
            border-color: rgba(229, 9, 20, 0.5);
        }

        .poster-container {
            aspect-ratio: 2 / 3;
            width: 100%;
            position: relative;
            background: #151821;
            overflow: hidden;
        }

        .poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s;
        }

        .movie-card:hover .poster-img {
            transform: scale(1.04);
        }

        .poster-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #181d29 0%, #10131b 100%);
            color: rgba(255,255,255,0.2);
        }

        .poster-fallback i {
            font-size: 44px;
        }

        .year-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            color: #f3f4f6;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            z-index: 5;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .quality-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            color: #22c55e;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            z-index: 5;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .card-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            justify-content: space-between;
        }

        .movie-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .movie-file {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 70px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 50px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        footer {
            background: #08090c;
            border-top: 1px solid var(--border-color);
            padding: 24px 20px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="logo" onclick="resetToHome()">
                <div class="logo-icon"><i class="fa-solid fa-film"></i></div>
                <h1>Películas</h1>
            </div>

            <div class="controls-wrapper">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>

                </div>

                <div class="year-select-box">
                    <label for="yearFilter"><i class="fa-regular fa-calendar"></i> Año:</label>
                    <select id="yearFilter" onchange="handleYearChange(this.value)">
                        <option value="Todos">Todos</option>
                    </select>
                </div>

                <button class="btn-random" onclick="showRandom30()" title="Mostrar otras 30 aleatorias">
                    <i class="fa-solid fa-shuffle"></i> 30 Aleatorias
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="section-header">
            <div class="section-title">
                <i class="fa-solid fa-layer-group"></i>

            </div>
            <span class="badge-count" id="countBadge">30 películas</span>
        </div>

        <div class="movies-grid" id="moviesGrid">
            <!-- Las tarjetas se generan dinámicamente con JS -->
        </div>
    </main>

    <footer>
        <p>Catálogo de Películas &bull; <strong>D:peliculas</strong> &bull; Total en biblioteca: 386 títulos</p>
    </footer>

                card.className = "movie-card";

                const posterHtml = m.poster 
                    ? `<img class="poster-img" src="${m.poster}" alt="${m.title}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                       <div class="poster-fallback" style="display:none;"><i class="fa-solid fa-film"></i></div>`
                    : `<div class="poster-fallback"><i class="fa-solid fa-film"></i></div>`;

                const yearBadge = m.year ? `<span class="year-badge">${m.year}</span>` : "";

                card.innerHTML = `
                    <div class="poster-container">
                        <span class="quality-badge">MP4</span>
                        ${yearBadge}
                        ${posterHtml}
                    </div>
                    <div class="card-info">
                        <div class="movie-title" title="${m.title}">${m.title}</div>
                        <div class="movie-file" title="${m.filename}">
                            <i class="fa-solid fa-file-video"></i> ${m.filename}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateCatalog() {
            const hasFilter = currentSearch.trim() !== "" || currentYear !== "Todos";

            if (!hasFilter && isRandomMode) {
                const sample = getRandom30(ALL_MOVIES);
                renderMovies(sample, "30 Películas Aleatorias");
                return;
            }

            let filtered = ALL_MOVIES;

            if (currentSearch.trim() !== "") {
                const q = currentSearch.toLowerCase();
                filtered = filtered.filter(m => 
                    m.title.toLowerCase().includes(q) || 
                    m.filename.toLowerCase().includes(q)
                );
            }

            if (currentYear !== "Todos") {
                filtered = filtered.filter(m => m.year === currentYear);
            }

            let label = "Películas Encontradas";
            if (currentYear !== "Todos" && currentSearch.trim() !== "") {
                label = `Resultados para "${currentSearch}" (Año ${currentYear})`;
            } else if (currentYear !== "Todos") {
                label = `Películas del Año ${currentYear}`;
            } else if (currentSearch.trim() !== "") {
                label = `Resultados para "${currentSearch}"`;
            }

            renderMovies(filtered, label);
        }

        function handleSearch(val) {
            currentSearch = val;
            isRandomMode = false;
            updateCatalog();
        }

        function handleYearChange(year) {
            currentYear = year;
            isRandomMode = false;
            updateCatalog();
        }

        function showRandom30() {
            document.getElementById("searchInput").value = "";
            document.getElementById("yearFilter").value = "Todos";
            currentSearch = "";
            currentYear = "Todos";
            isRandomMode = true;
            updateCatalog();
        }

        function resetToHome() {
            showRandom30();
        }

        // Carga inicial
        showRandom30();
    </script>

</body>
</html>
